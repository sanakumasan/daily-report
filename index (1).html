<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETC高速記録アプリ</title>
</head>
<body style="font-family:sans-serif; padding:15px; max-width:500px; margin:0 auto;">

    <h2>🚗 ETC高速利用記録</h2>

    <!-- 当月集計 -->
    <div style="background:#e0f2fe; padding:10px; border-radius:5px; margin-bottom:15px; text-align:center;">
        <span id="current-month-label" style="font-weight:bold;">今月</span>の合計ETC代: 
        <span id="month-total-etc" style="font-size:1.4rem; font-weight:bold; color:#0284c7;">0</span> 円
    </div>

    <!-- 入力フォーム -->
    <form onsubmit="saveData(event)" style="background:#f8fafc; padding:15px; border:1px solid #cbd5e1; border-radius:5px;">
        <p style="margin-top:0;">利用日時:<br><input type="datetime-local" id="etc-date" required style="width:100%; padding:5px;"></p>
        <p>入口IC:<br><input type="text" id="entry-ic" placeholder="例：東京" required style="width:100%; padding:5px;"></p>
        <p>出口IC:<br><input type="text" id="exit-ic" placeholder="例：横浜" required style="width:100%; padding:5px;"></p>
        <p>ETC料金（円）:<br><input type="number" id="etc-price" placeholder="例：1200" min="0" required style="width:100%; padding:5px;"></p>
        <p>メモ（任意）:<br><input type="text" id="etc-memo" placeholder="仕事、旅行など" style="width:100%; padding:5px;"></p>
        
        <button type="submit" style="width:100%; padding:10px; background:#0284c7; color:white; border:none; border-radius:5px; font-weight:bold;">記録を保存する</button>
    </form>

    <!-- 履歴一覧 -->
    <h3>📊 利用履歴</h3>
    <p>表示月: <input type="month" id="filter-month" onchange="showHistory()"></p>
    <div id="history-list"></div>

<script>
    let etcRecords = [];

    window.onload = function() {
        const today = new Date();
        // 日本時間に合わせた初期値設定
        const offset = today.getTimezoneOffset() * 60000;
        const localISOTime = (new Date(today - offset)).toISOString().slice(0,16);
        document.getElementById('etc-date').value = localISOTime;
        document.getElementById('filter-month').value = today.toISOString().slice(0,7);
        
        loadData();
    };

    function loadData() {
        const stored = localStorage.getItem('etc_highway_records');
        if (stored) {
            try { etcRecords = JSON.parse(stored); } catch(e) { console.error(e); }
        }
        showHistory();
    }

    function saveData(e) {
        e.preventDefault();
        
        etcRecords.push({
            id: Date.now(),
            date: document.getElementById('etc-date').value,
            entry: document.getElementById('entry-ic').value,
            exit: document.getElementById('exit-ic').value,
            price: parseInt(document.getElementById('etc-price').value) || 0,
            memo: document.getElementById('etc-memo').value
        });

        localStorage.setItem('etc_highway_records', JSON.stringify(etcRecords));
        
        // フォームをリセット
        document.getElementById('entry-ic').value = "";
        document.getElementById('exit-ic').value = "";
        document.getElementById('etc-price').value = "";
        document.getElementById('etc-memo').value = "";
        
        showHistory();
    }

    function showHistory() {
        const filterMonth = document.getElementById('filter-month').value;
        document.getElementById('current-month-label').innerText = filterMonth.replace('-','年') + '月';
        
        const container = document.getElementById('history-list');
        container.innerHTML = '';
        
        let monthTotal = 0;

        // 日時の新しい順にソートしてループ
        [...etcRecords].sort((a,b) => b.date.localeCompare(a.date)).forEach(r => {
            const rMonth = r.date.slice(0, 7);
            
            if (rMonth === filterMonth) {
                monthTotal += r.price;

                const div = document.createElement('div');
                div.style.borderBottom = "1px solid #e2e8f0";
                div.style.padding = "10px 0";
                div.innerHTML = `
                    <div style="font-size:0.8rem; color:#64748b;">📅 ${r.date.replace('T',' ')}</div>
                    <div style="font-weight:bold; margin:3px 0;">📍 ${r.entry} ➡️ 🏁 ${r.exit}</div>
                    <div style="display:flex; justify-content:space-between;">
                        <span>💰 <strong style="color:#0284c7;">${r.price.toLocaleString()}</strong> 円 ${r.memo ? `(${r.memo})` : ''}</span>
                        <span style="color:#ef4444; font-size:0.85rem; cursor:pointer;" onclick="deleteData(${r.id})">削除</span>
                    </div>
                `;
                container.appendChild(div);
            }
        });

        document.getElementById('month-total-etc').innerText = monthTotal.toLocaleString();
    }

    function deleteData(id) {
        if (confirm('この記録を削除しますか？')) {
            etcRecords = etcRecords.filter(r => r.id !== id);
            localStorage.setItem('etc_highway_records', JSON.stringify(etcRecords));
            showHistory();
        }
    }
</script>
</body>
</html>
